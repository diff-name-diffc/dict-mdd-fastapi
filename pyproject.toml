[project]
name = "mdd-api"
version = "0.1.0"
description = "FastAPI service for querying MDD pronunciation resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "readmdict>=0.1.0",
    "python-multipart>=0.0.6",
    "python-lzo>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "models"]
